<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07080e" />
    <meta name="description" content="NFT FLEX — кейсы, апгрейдер, ракета, рынок и коллекция NFT в Telegram." />
    <title>NFT FLEX</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=6" />
    <script src="/vendor/telegram-web-app.js?v=6"></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient-grid"></div>
      <div class="orb orb-violet"></div>
      <div class="orb orb-cyan"></div>
      <div class="orb orb-pink"></div>
      <div class="noise"></div>
    </div>

    <div id="splash" class="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="splash-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee" />
              <stop offset=".5" stop-color="#8b5cf6" />
              <stop offset="1" stop-color="#ff4d8d" />
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="49" fill="none" stroke="url(#splash-gradient)" stroke-width="1.5" opacity=".45" />
          <circle cx="60" cy="60" r="37" fill="none" stroke="url(#splash-gradient)" stroke-width="1" opacity=".25" />
          <path d="M34 79V41l26 15 26-15v38L60 64z" fill="url(#splash-gradient)" />
        </svg>
      </div>
      <div class="splash-title">NFT FLEX</div>
      <div class="splash-sub">ТВОЙ ЦИФРОВОЙ ФЛЕКС</div>
      <div class="splash-loader"><span></span></div>
      <div class="splash-status" id="splash-status">Подключаем коллекцию</div>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar" id="topbar">
        <button class="brand" data-route="cases" aria-label="NFT FLEX">
          <span class="brand-mark">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs>
                <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#22d3ee" />
                  <stop offset=".5" stop-color="#8b5cf6" />
                  <stop offset="1" stop-color="#ff4d8d" />
                </linearGradient>
              </defs>
              <path d="M9 34V14l15 9 15-9v20L24 25z" fill="url(#brand-gradient)" />
            </svg>
          </span>
          <span class="brand-copy"><b>NFT FLEX</b><small>digital flex</small></span>
        </button>
        <div class="topbar-actions">
          <button class="balance-chip" data-action="daily" aria-label="Ежедневный бонус">
            <svg class="icon"><use href="#i-star"></use></svg>
            <span id="top-balance">0</span>
            <span class="balance-dot" id="daily-dot"></span>
          </button>
          <button class="avatar-btn" id="profile-btn" data-route="profile" aria-label="Профиль">
            <span class="avatar-fallback" id="top-avatar">NF</span>
          </button>
        </div>
      </header>

      <main id="view" class="view" aria-live="polite"></main>

      <nav class="tabbar" id="tabbar" aria-label="Навигация">
        <button class="tab" data-route="cases">
          <svg class="icon"><use href="#i-box"></use></svg><span>Кейсы</span>
        </button>
        <button class="tab" data-route="inventory">
          <svg class="icon"><use href="#i-layers"></use></svg><span>Коллекция</span>
        </button>
        <button class="tab tab-center" data-route="gifts">
          <span class="tab-center-glow"></span>
          <svg class="icon"><use href="#i-gift"></use></svg><span>Подарки</span>
        </button>
        <button class="tab" data-route="games">
          <svg class="icon"><use href="#i-rocket"></use></svg><span>Игры</span>
        </button>
        <button class="tab" data-route="market">
          <svg class="icon"><use href="#i-market"></use></svg><span>Рынок</span>
        </button>
      </nav>
    </div>

    <div id="auth-screen" class="auth-screen" hidden>
      <div class="auth-card">
        <div class="auth-mark"><svg class="icon"><use href="#i-lock"></use></svg></div>
        <h1>Нужен Telegram</h1>
        <p>NFT FLEX работает внутри Telegram. Открой игру через бота, чтобы получить доступ к профилю, коллекции и рынку.</p>
        <p class="auth-debug" id="auth-debug"></p>
        <a class="btn btn-primary" href="https://t.me/Nftflex_bot" target="_blank" rel="noopener">Открыть бота</a>
      </div>
    </div>

    <div id="modal-root" class="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <div id="fx-root" class="fx-root"></div>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/><path d="m8 5.2 8 4.5"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="i-upgrade" viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/><path d="M5 20h14"/></symbol>
      <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M14 4c3-1 5-1 6-1 0 1 0 3-1 6l-5 5-4-4z"/><path d="m10 10-4 1-2 3 5 1M14 14l-1 4-3 2-1-5"/><circle cx="15.5" cy="7.5" r="1.2"/><path d="M6 16c-2 1-3 3-3 5 2 0 4-1 5-3"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/></symbol>
      <symbol id="i-market" viewBox="0 0 24 24"><path d="M4 9h16l-1-4H5z"/><path d="M5 9v10h14V9"/><path d="M9 19v-5h6v5M8 5 7 9M12 5v4M16 5l1 4"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="m4 17 2-9 4 4 2-7 2 7 4-4 2 9z"/><path d="M5 20h14"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8z"/><path d="m11 13 4-4"/></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10h6M12 7v10M9 14h6"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M13 3c1 4-2 5-2 8 0-2-2-3-2-5-3 3-4 6-4 9a7 7 0 0 0 14 0c0-2-1-4-2-6-1 3-3 4-4 5 2-4 1-8 0-11z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3 3 5-7"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 3.1a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 3.1h5l.4-3.1a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M12 10v10M4 10h16M12 10C9 10 7 8 7 6s3-3 5 4c2-7 5-6 5-4s-2 4-5 4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-8 12h6l-1 8 8-12h-6z"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M12 13v5M8 21h8M9 18h6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20S4 15 4 9c0-3 2-5 5-5 2 0 3 1 3 2 0-1 1-2 3-2 3 0 5 2 5 5 0 6-8 11-8 11z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.5"/></symbol>
      <symbol id="i-gavel" viewBox="0 0 24 24"><path d="m14 4 6 6M12 6l6 6M4 20l7-7M9 9l6 6M5 21h7"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4zM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8zM5 14l.6 1.4L7 16l-1.4.6L5 18l-.6-1.4L3 16l1.4-.6z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 9v4M12 16h.01"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-skull" viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 14 0c0 3-1 5-3 6v3H8v-3c-2-1-3-3-3-6z"/><circle cx="9.5" cy="11" r="1.3"/><circle cx="14.5" cy="11" r="1.3"/><path d="M10 17h4M11 20v-3M13 20v-3"/></symbol>
    </svg>

    <script type="module" src="/app.js?v=6"></script>
  </body>
</html>
